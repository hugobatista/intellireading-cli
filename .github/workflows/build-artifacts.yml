# yamllint disable-line rule:line-length
name: build_artifacts

on:
  workflow_dispatch:

run-name: ${{ github.ref_name }} -> build_artifacts ( ${{ github.run_attempt }} )

jobs:
  build_artifacts:
    name: build_artifacts
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:

    - name: Echo current date and time
      id: datetime
      run: |
        echo "datetime: $(date '+%Y-%m-%d %H:%M:%S')"

    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        fetch-depth: 1

    - name: Install uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        resolution-strategy: lowest

    - name: Sync dev group
      run: uv sync --frozen --group dev --no-install-project

    - name: Get version
      id: get_version
      run: |
        echo "version=$(uv run --no-sync hatch version)" >> $GITHUB_OUTPUT

    - name: Build package
      run: uv build

    - name: Archive all artifacts in dist/
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dist-v${{ steps.get_version.outputs.version }}
        path: dist/
        if-no-files-found: error
