# yamllint disable-line rule:line-length
name: build_artifacts

on:
  workflow_dispatch:

run-name: ${{ github.ref_name }} -> build_artifacts ( ${{ github.run_attempt }} )

jobs:
  build_artifacts:
    name: build_artifacts
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:

    - name: Echo current date and time
      id: datetime
      run: |
        echo "datetime: $(date '+%Y-%m-%d %H:%M:%S')"

    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 1

    - name: Install uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

    - name: Sync dev group
      run: uv sync --frozen --group dev --no-install-project

    - name: Get version
      id: get_version
      run: |
        echo "version=$(uv run --no-sync hatch version)" >> $GITHUB_OUTPUT

    - name: Build package
      run: uv build

    - name: Archive all artifacts in dist/
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: dist-v${{ steps.get_version.outputs.version }}
        path: dist/
        if-no-files-found: error
