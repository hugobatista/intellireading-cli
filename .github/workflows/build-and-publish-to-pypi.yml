# yamllint disable rule:line-length
name: build_and_pub_to_pypi

on:
  release:
    types: [published]
  workflow_dispatch:

run-name: ${{ github.ref_name }} -> build_and_pub_to_pypi ( ${{ github.run_attempt }} )

jobs:
  build_and_pub_to_pypi:
    name: build_and_pub_to_pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:

    - name: Echo current date and time
      id: datetime
      run: |
        echo "datetime: $(date '+%Y-%m-%d %H:%M:%S')"

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1

    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        resolution-strategy: lowest

    - name: Sync dev group
      run: uv sync --frozen --group dev --no-install-project

    - name: Get version
      id: get_version
      run: |
        echo "version=$(uv run --no-sync hatch version)" >> $GITHUB_OUTPUT

    #validates that the version is a valid semver
    - name: Validate version
      id: validate_version
      run: |
        if [[ ! ${{ steps.get_version.outputs.version }} =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Invalid version: ${{ steps.get_version.outputs.version }}"
          exit 1
        fi

    - name: Build package
      run: uv build

    - name: Display structure of build files
      id: display_build_files
      run: |
        ls -R dist/

    - name: Archive all artifacts in dist/
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dist-v${{ steps.get_version.outputs.version }}
        path: dist/
        if-no-files-found: error

    - name: Publish to PyPi
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
