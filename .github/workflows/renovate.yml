name: renovate

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Dry run (no changes)
        required: false
        default: false
        type: boolean

  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:

  renovate:

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set dry-run mode
        if: ${{ inputs.dry-run == true }}
        run: echo "RENOVATE_DRY_RUN=full" >> "$GITHUB_ENV"

      - name: Set repository
        run: |
          if [ -z "${RENOVATE_REPOSITORIES:-}" ]; then
            echo "RENOVATE_REPOSITORIES=${{ github.repository }}" >> "$GITHUB_ENV"
          fi

      - name: Set LOG_LEVEL
        run: |
          if [ -z "${LOG_LEVEL:-}" ]; then
            echo "LOG_LEVEL=info" >> "$GITHUB_ENV"
          fi

      - name: Run Renovate
        uses: docker://ghcr.io/renovatebot/renovate:44.151.0@sha256:8a79148ec24cc05809782e20e720dafe9dde0c24a00f26e76d14dec2cbd74a53
        env:
          RENOVATE_CONFIG_FILE: renovate.json
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
